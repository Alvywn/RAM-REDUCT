[package]
name = "ramreduct"
version = "3.5.3"
edition = "2021"
authors = ["Henry++", "RAM Reduct Rust Port"]
description = "Lightweight real-time memory management application to monitor and clean system memory"
license = "GPL-3.0"
build = "build.rs"

[[bin]]
name = "ramreduct"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
